<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;overflow:hidden;background:transparent}</style>
<script type="importmap">{"imports":{"three":"./three/build/three.module.js","three/addons/":"./three/examples/jsm/"}}</script></head><body>
<script type="module">
// Vorschau des Raumjägers: ?mode=day|night&az=..&el=..&explode=0..1&zoom=1
import * as THREE from 'three';
import { STLLoader } from 'three/addons/loaders/STLLoader.js';
const q = new URLSearchParams(location.search);
const night = q.get('mode') === 'night', az = +(q.get('az') ?? 35), el = +(q.get('el') ?? 22);
const ex = +(q.get('explode') || 0), zoom = +(q.get('zoom') || 1), dir = q.get('dir') || '../../_pj';
const W = innerWidth, H = innerHeight;
const r = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
r.setSize(W, H); r.toneMapping = THREE.ACESFilmicToneMapping; r.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(r.domElement);
const scene = new THREE.Scene(); if (night) scene.background = new THREE.Color(0x0b1020);
scene.add(new THREE.HemisphereLight(0xdfe7ff, 0x30303a, night ? 0.12 : 1.3));
const d = new THREE.DirectionalLight(0xffffff, night ? 0.12 : 2.0); d.position.set(150, 250, 500); scene.add(d);
const d2 = new THREE.DirectionalLight(0xaab8ff, night ? 0.05 : 0.7); d2.position.set(-300, -200, 100); scene.add(d2);
const GREY = 0xc9ccd2, DARK = 0x3b414c, ACC = 0xe0582a, FL = 0x9aa1ab;
const only = q.get('only');
const P = {
  'rumpf-unten': [GREY, 0, 0, -0.6], 'rumpf-oben': [GREY, 0, 0, 1.3], kanzel: [DARK, 0, 0, 2.2], leitwerk: [ACC, 0, 0, 2.2],
  'fluegel-links': [DARK, 0, 1, 0], 'fluegel-rechts': [DARK, 0, -1, 0],
  'triebwerk-links': [GREY, 0, 1.3, 1.2], 'triebwerk-rechts': [GREY, 0, -1.3, 1.2],
  'flamme-links': [FL, -1.0, 1.3, 1.2, 0xff6a10, 2.0, 0.85], 'flamme-rechts': [FL, -1.0, -1.3, 1.2, 0xff6a10, 2.0, 0.85],
  'kanone-links': [FL, 0.6, 1.0, 0, 0xff2a2a, 1.6, 0.85], 'kanone-rechts': [FL, 0.6, -1.0, 0, 0xff2a2a, 1.6, 0.85],
  scheinwerfer: [0xffffff, 0.6, 0, -0.6, 0xffffff, 4.0], griff: [DARK, 0, 0, 0], 'griff-boden': [GREY, 0, 0, -0.5],
  papier: [0xffc27a, 0, 0, 0, 0xffa640, 1.4], 'papier-kanzel': [0x7fd2ff, 0, 0, 1.6, 0x3cb6ff, 1.5],
  'kanaldeckel-links': [DARK, 0, 1, 0.5], 'kanaldeckel-rechts': [DARK, 0, -1, 0.5],
  'fussdeckel-links': [DARK, 0, 1, 0.5], 'fussdeckel-rechts': [DARK, 0, -1, 0.5], 'griff-bock': [GREY, 0, 0, -0.5],
};
const L = new STLLoader(), g = new THREE.Group(); scene.add(g); let n = 0; const onlyList = only ? only.split(',') : null; const keys = Object.keys(P).filter(k => onlyList ? onlyList.some(o => k.startsWith(o)) : (!k.startsWith('griff') && !(ex > 0 && (k.startsWith('papier') || k === 'scheinwerfer'))));
for (const k of keys) L.load(`${dir}/${k}.stl`, (geo) => {
  geo.computeVertexNormals(); const [col, ox, oy, oz, em, ei, op] = P[k];
  const m = new THREE.MeshStandardMaterial({ color: col, roughness: 0.55, metalness: 0.08, side: THREE.DoubleSide,
    flatShading: !k.startsWith('flamme') && !k.startsWith('triebwerk'), transparent: !!op, opacity: op || 1 });
  if (em) { m.emissive = new THREE.Color(em); m.emissiveIntensity = night ? ei : (k.startsWith('papier') ? 0.08 : (k.startsWith('flamme') || k.startsWith('kanone') ? 0.0 : 0.5)); }
  if (night && !em) m.color.multiplyScalar(0.25);
  const mesh = new THREE.Mesh(geo, m); mesh.position.set(ox * ex * 60, oy * ex * 60, oz * ex * 60);
  g.add(mesh); if (++n === keys.length) go();
}, undefined, () => { if (++n === keys.length) go(); });
function go() {
  if (night && !only) {
    const h = new THREE.SpotLight(0xffffff, 60000, 900, 0.35, 0.6, 2); h.position.set(246, 0, -24); h.target.position.set(600, 0, -60); g.add(h); g.add(h.target);
    const a = new THREE.PointLight(0xffb060, 25000, 500, 2); a.position.set(90, 0, 0); g.add(a);
    for (const s of [1, -1]) { const f = new THREE.PointLight(0xff7020, 15000, 400, 2); f.position.set(-80, 65.5 * s, 8); g.add(f); }
  }
  const b = new THREE.Box3().setFromObject(g), c = b.getCenter(new THREE.Vector3()), s = b.getSize(new THREE.Vector3()).length();
  const cam = new THREE.PerspectiveCamera(26, W / H, 1, 5000); cam.up.set(0, 0, 1);
  const a = THREE.MathUtils.degToRad(az), e = THREE.MathUtils.degToRad(el), dist = s * 1.5 / zoom;
  cam.position.set(c.x + dist * Math.cos(e) * Math.cos(a), c.y + dist * Math.cos(e) * Math.sin(a), c.z + dist * Math.sin(e)); cam.lookAt(c);
  r.render(scene, cam); window.READY = true;
}
</script></body></html>
